name: Build Windows EXE

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2019  # Windows 7 兼容
    strategy:
      matrix:
        python-version: ["3.8"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "执法检测系统" `
            --add-data "事实认定书模板.docx;." `
            --add-data "使用说明.md;." `
            --add-data "column_mapping.json;." `
            --hidden-import pandas `
            --hidden-import openpyxl `
            --hidden-import docx `
            --hidden-import lxml `
            --hidden-import customtkinter `
            --hidden-import openai `
            --hidden-import httpx `
            --hidden-import httpcore `
            --hidden-import sniffio `
            --hidden-import PIL `
            --hidden-import numpy `
            --hidden-import preprocess `
            --hidden-import generate_report `
            --hidden-import process_zero_balance `
            --hidden-import logger `
            --hidden-import tkinter `
            --hidden-import xml.etree.ElementTree `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module PyQt5 `
            --exclude-module notebook `
            --exclude-module IPython `
            --exclude-module jupyter `
            --exclude-module bokeh `
            --exclude-module plotly `
            gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 执法检测系统-Win7-x64
          path: dist/执法检测系统.exe
