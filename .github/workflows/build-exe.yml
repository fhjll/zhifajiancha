name: Build Windows EXE

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2019  # Python 3.8 避免 numpy ABI 不兼容
    strategy:
      matrix:
        python-version: ["3.8"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==5.13.2
          pip install numpy==1.23.5 pandas==1.5.3 openpyxl python-docx openai customtkinter

      - name: Build EXE (via spec)
        run: pyinstaller 执法检测系统_Win_x64.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 执法检测系统-Win7-x64
          path: dist/执法检测系统.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 执法检测系统 Build ${{ github.run_number }}
          files: dist/执法检测系统.exe
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
